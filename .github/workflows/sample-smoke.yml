name: sample-surface

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-logger:
    name: Go logger samples (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.18.10"
          - stable
    steps:
      - name: Check out samples
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Run public Go logger samples
        run: |
          bash run.sh logger go basic
          bash run.sh logger go pressure

  go-runtime:
    name: Go runtime samples (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22.12"
          - stable
    steps:
      - name: Check out samples
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Run public Go runtime samples
        run: |
          bash run.sh runtime go basic
          bash run.sh runtime go deadletter

  surface:
    name: public sample surface
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out samples
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Check public entrypoints
        run: |
          bash run.sh list
          bash -n run.sh
          bash -n coakka-runtime/run.sh
          bash -n coakka-logger/run.sh
          bash -n coakka-logger/run-all.sh
          bash -n coakka-runtime/run-all.sh
          bash -n coakka-runtime/runtime-test/run.sh
          bash -n coakka-runtime/evidence/native/run.sh
          bash -n coakka-runtime/tools/coakka-client/run.sh
          bash -n scripts/check-artifact-pins.sh
          bash -n scripts/doctor.sh
          bash -n scripts/resolve-artifact.sh
          bash -n scripts/test-artifact-pins.sh
          bash -n scripts/test-resolve-artifact.sh
          bash -n scripts/sample-metadata.sh
          bash -n scripts/sample-utils.sh
          bash -n coakka-runtime/scripts/smoke-customer-runtime.sh
          bash -n coakka-runtime/scripts/smoke-quarkus-local.sh
          bash -n coakka-runtime/scripts/smoke-spring-boot-starter-local.sh
          bash -n coakka-logger/csharp/basic/run.sh
          bash -n coakka-logger/csharp/pressure/run.sh
          bash -n coakka-logger/rust/basic/run.sh
          bash -n coakka-logger/rust/pressure/run.sh
          bash -n coakka-logger/swift/basic/run.sh
          bash -n coakka-runtime/swift/basic/run.sh

      - name: Check product dispatch and directory ownership
        run: |
          layout_work="$(mktemp -d "${RUNNER_TEMP}/coakka-product-layout.XXXXXX")"
          trap 'rm -rf "${layout_work}"' EXIT
          COAKKA_DOC_TEST_ROOT="${layout_work}" python3 -B scripts/test-product-layout.py

      - name: Check script syntax
        run: |
          python3 -m py_compile \
            coakka-runtime/python/basic/main.py \
            coakka-runtime/python/deadletter/main.py \
            coakka-runtime/python/hot-reload/main.py \
            coakka-runtime/scenarios/customer-crud/python-desktop-local/app.py \
            coakka-logger/python/basic/main.py \
            coakka-logger/python/pressure/main.py
          node --check coakka-runtime/node/basic/main.mjs
          node --check coakka-runtime/node/deadletter/main.mjs
          node --check coakka-runtime/scenarios/customer-crud/spring-boot-node/store.mjs
          node --check coakka-runtime/scenarios/customer-crud/spring-boot-nodes/audit.mjs
          node --check coakka-runtime/scenarios/customer-crud/spring-boot-nodes/store.mjs
          node --check coakka-logger/node/basic/main.mjs
          node --check coakka-logger/node/pressure/main.mjs
          node --check coakka-logger/bun/basic/main.mjs
          node --check coakka-logger/bun/pressure/main.mjs
          node --check coakka-logger/electron/basic/main.mjs

      - name: Check public artifact pins
        run: |
          bash scripts/test-artifact-pins.sh
          bash scripts/test-resolve-artifact.sh
          COAKKA_PIN_CHECK_NETWORK=1 bash scripts/check-artifact-pins.sh

      - name: Run public quickstart
        run: bash run.sh quickstart

      - name: Stop quickstart containers
        if: always()
        run: bash run.sh containers node-python down || true

      - name: Run public logger package smoke
        run: |
          dotnet --version
          cargo --version
          bash run.sh logger csharp basic
          bash run.sh logger rust basic

      - name: Run public runtime smoke
        run: |
          bash run.sh runtime jvm basic
          bash run.sh runtime python basic
          bash run.sh runtime node basic
          bash run.sh runtime native basic
          bash run.sh runtime native pressure
          bash run.sh runtime-test smoke --payload 64K --requests 128
          bash run.sh runtime-test pressure --requests 512 --queue-capacity 2
          bash run.sh runtime-test hot-reload --threads 2 --requests 64 --generations 8 --queue-capacity 64

      - name: Run public runtime client smoke
        run: bash run.sh runtime-client

  native-evidence-windows:
    name: native evidence / windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out samples
        uses: actions/checkout@v6

      - name: Run native evidence smoke
        shell: pwsh
        run: |
          ./coakka-runtime/runtime-test/run.ps1 smoke --payload 64K --requests 128

      - name: Run native evidence pressure
        shell: pwsh
        run: |
          ./coakka-runtime/runtime-test/run.ps1 pressure --requests 512 --queue-capacity 2

      - name: Run current native concurrency evidence
        shell: pwsh
        run: |
          ./coakka-runtime/runtime-test/run.ps1 race --threads 2 --requests 32 --lifecycle-iterations 2 --queue-capacity 64

  native-evidence-macos:
    name: native evidence / macos-aarch64
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out samples
        uses: actions/checkout@v6

      - name: Run current native evidence
        run: |
          bash run.sh runtime-test smoke --payload 64K --requests 128
          bash run.sh runtime-test pressure --requests 512 --queue-capacity 2
          bash run.sh runtime-test connection-strategies
          bash run.sh runtime-test hot-reload --threads 2 --requests 64 --generations 8 --queue-capacity 64
