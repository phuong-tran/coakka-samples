name: sample-surface

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface:
    name: public sample surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out samples
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check public entrypoints
        run: |
          bash run.sh list
          bash -n run.sh
          bash -n logger/run-all.sh
          bash -n runtime/run-all.sh
          bash -n scripts/check-artifact-pins.sh
          bash -n scripts/doctor.sh
          bash -n scripts/resolve-artifact.sh
          bash -n scripts/test-artifact-pins.sh
          bash -n scripts/test-resolve-artifact.sh
          bash -n scripts/sample-metadata.sh
          bash -n scripts/sample-utils.sh
          bash -n scripts/smoke-customer-runtime.sh
          bash -n scripts/smoke-quarkus-local.sh
          bash -n scripts/smoke-spring-boot-starter-local.sh

      - name: Check script syntax
        run: |
          python3 -m py_compile \
            runtime/python/basic/main.py \
            runtime/python/deadletter/main.py \
            runtime/python/hot-reload/main.py \
            runtime/scenarios/customer-crud/python-desktop-local/app.py \
            logger/python/basic/main.py \
            logger/python/pressure/main.py
          node --check runtime/node/basic/main.mjs
          node --check runtime/node/deadletter/main.mjs
          node --check runtime/scenarios/customer-crud/spring-boot-node/store.mjs
          node --check runtime/scenarios/customer-crud/spring-boot-nodes/audit.mjs
          node --check runtime/scenarios/customer-crud/spring-boot-nodes/store.mjs
          node --check logger/node/basic/main.mjs
          node --check logger/node/pressure/main.mjs

      - name: Check public artifact pins
        run: |
          bash scripts/test-artifact-pins.sh
          bash scripts/test-resolve-artifact.sh
          COAKKA_PIN_CHECK_NETWORK=1 bash scripts/check-artifact-pins.sh

      - name: Run public quickstart
        run: bash run.sh quickstart

      - name: Run public runtime smoke
        run: |
          bash run.sh runtime jvm basic
          bash run.sh runtime python basic
          bash run.sh runtime node basic
          bash run.sh runtime native basic
          bash run.sh runtime native pressure
