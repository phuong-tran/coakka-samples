<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node Customer Audit</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --line: #dce4eb;
      --text: #1b2530;
      --muted: #637486;
      --code: #111820;
      --codeText: #edf6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      gap: 18px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      padding: 18px 0 4px;
    }
    h1, h2 { margin: 0; }
    h1 { font-size: 2rem; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; }
    p { margin: 4px 0 0; color: var(--muted); }
    .badge {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(520px, 1.2fr) minmax(360px, .8fr);
      gap: 18px;
    }
    .stack { display: grid; gap: 18px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    pre {
      margin: 0;
      min-height: 150px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 6px;
      padding: 12px;
      background: var(--code);
      color: var(--codeText);
      font: .84rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfdfe;
    }
    .metric span { display: block; color: var(--muted); font-size: .76rem; }
    .metric strong { display: block; margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 980px) {
      header, .layout { grid-template-columns: 1fr; display: grid; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Node Customer Audit</h1>
      <p>Typed mutation event receiver for the customer workflow.</p>
    </div>
    <div class="badge">HTTP 8094 + runtime target samples.customer.audit</div>
  </header>

  <div class="layout">
    <section>
      <h2>Audit Events</h2>
      <table>
        <thead>
        <tr>
          <th>Event</th>
          <th>Operation</th>
          <th>Customer</th>
          <th>Revision</th>
          <th>Observed</th>
        </tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
    </section>

    <div class="stack">
      <section>
        <h2>Runtime Summary</h2>
        <div class="metrics" id="metrics"></div>
      </section>
      <section>
        <h2>Runtime JSON</h2>
        <pre id="runtime-box">Loading...</pre>
      </section>
    </div>
  </div>
</main>

<script>
  const eventsBody = document.getElementById('events-body');
  const runtimeBox = document.getElementById('runtime-box');
  const metrics = document.getElementById('metrics');

  function metric(label, value) {
    return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
  }

  async function api(path) {
    const response = await fetch(path);
    const text = await response.text();
    const body = text ? JSON.parse(text) : null;
    if (!response.ok) throw body || { error: response.statusText };
    return body;
  }

  async function loadEvents() {
    try {
      const result = await api('/api/audit/events');
      eventsBody.innerHTML = result.events.map((event) => `
        <tr>
          <td>${event.eventId}</td>
          <td>${event.operation}</td>
          <td>${event.customerId}</td>
          <td>${event.revision}</td>
          <td>${event.observedAt}</td>
        </tr>
      `).join('') || '<tr><td colspan="5">No audit events yet.</td></tr>';
    } catch (error) {
      eventsBody.innerHTML = `<tr><td colspan="5">${String(error.error || error)}</td></tr>`;
    }
  }

  async function loadRuntime() {
    try {
      const runtime = await api('/api/audit/runtime');
      metrics.innerHTML = [
        metric('Runtime', runtime.runtimeInfo.runtimeVersion),
        metric('Backend', runtime.runtimeInfo.southboundBackend),
        metric('Node', runtime.runtimeConfig.nodeId),
        metric('Routes', runtime.runtimeConfig.routeCount),
        metric('Runtime delivered', runtime.clientStats.deliveredRequests),
        metric('Retained events', runtime.connector.retainedEvents),
      ].join('');
      runtimeBox.textContent = JSON.stringify(runtime, null, 2);
    } catch (error) {
      runtimeBox.textContent = JSON.stringify(error, null, 2);
    }
  }

  loadEvents();
  loadRuntime();
  setInterval(loadEvents, 1500);
  setInterval(loadRuntime, 2500);
</script>
</body>
</html>
