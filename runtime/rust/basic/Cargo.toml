[package]
name = "coakka-runtime-sample"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
coakka-runtime-rs = { path = "../RuntimeCandidate", version = "=2.5.3" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
