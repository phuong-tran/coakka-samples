[package]
name = "coakka-sample-tauri-intent-command"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
coakka-runtime-rs = { path = "../RuntimeCandidate/rust", version = "=3.0.0" }
coakka-tauri-intents = { path = "../RuntimeCandidate/tauri-intents", version = "=3.0.0" }
serde_json = "=1.0.151"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
