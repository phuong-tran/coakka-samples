[package]
name = "coakka-sample-tauri-desktop-intent"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[lib]
name = "coakka_sample_tauri_desktop_intent"
path = "src/lib.rs"

[[bin]]
name = "coakka-sample-tauri-desktop-intent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
coakka-runtime-rs = { path = "../../RuntimeCandidate/rust", version = "=2.5.3" }
coakka-tauri-intents = { path = "../../RuntimeCandidate/tauri-intents", version = "=0.1.0" }
log = "=0.4.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = ["custom-protocol"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
