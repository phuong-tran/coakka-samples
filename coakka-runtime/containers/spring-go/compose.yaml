services:
  go-store:
    image: ${COAKKA_SAMPLE_GO_STORE_IMAGE:?Set COAKKA_SAMPLE_GO_STORE_IMAGE to a refreshed 1.3.2 Spring-Go store image before running this container lane.}
    hostname: go-store
    environment:
      COAKKA_SAMPLE_STORE_WEB_HOST: 0.0.0.0
      COAKKA_SAMPLE_STORE_WEB_PORT: "8081"
      COAKKA_SAMPLE_STORE_RUNTIME_BIND_HOST: go-store
      COAKKA_SAMPLE_STORE_RUNTIME_HOST: go-store
      COAKKA_SAMPLE_STORE_RUNTIME_PORT: "19332"
      COAKKA_SAMPLE_SPRING_RUNTIME_HOST: spring-web
      COAKKA_SAMPLE_SPRING_RUNTIME_PORT: "19331"
    ports:
      - "8091:8081"
    networks:
      - coakka-spring-go

  spring-web:
    image: ${COAKKA_SAMPLE_SPRING_WEB_IMAGE:?Set COAKKA_SAMPLE_SPRING_WEB_IMAGE to a refreshed 1.3.2 Spring-Go web image before running this container lane.}
    hostname: spring-web
    depends_on:
      - go-store
    environment:
      COAKKA_SAMPLE_WEB_HOST: 0.0.0.0
      COAKKA_SAMPLE_WEB_PORT: "8080"
      COAKKA_SAMPLE_SPRING_RUNTIME_BIND_HOST: spring-web
      COAKKA_SAMPLE_SPRING_RUNTIME_HOST: spring-web
      COAKKA_SAMPLE_SPRING_RUNTIME_PORT: "19331"
      COAKKA_SAMPLE_STORE_RUNTIME_HOST: go-store
      COAKKA_SAMPLE_STORE_RUNTIME_PORT: "19332"
    ports:
      - "8090:8080"
    networks:
      - coakka-spring-go

networks:
  coakka-spring-go:
